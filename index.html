<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TikTok Shop Manager</title>
  <script>
    (function() {
      var p = window.location.search;
      var code = new URLSearchParams(p).get('code') || new URLSearchParams(p).get('auth_code');
      if (code) { window.location.replace('http://localhost:3000/auth/callback' + p); }
    })();
  </script>
</head>
<body style="font-family:sans-serif;color:#666;padding:40px">
  <p>TikTok Shop Manager &mdash; OAuth Relay</p>
</body>
</html>
